services:
  chromadb:
    image: chromadb/chroma:0.5.20
    container_name: agent-chromadb
    ports:
      - "8001:8000"
    volumes:
      - ./data/docker/chroma:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=FALSE
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/heartbeat || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  neo4j:
    image: neo4j:5.25.1-community
    container_name: agent-neo4j
    ports:
      - "7474:7474"
      - "7688:7687"
    volumes:
      - ./data/docker/neo4j/data:/data
      - ./data/docker/neo4j/logs:/logs
    environment:
      - NEO4J_AUTH=neo4j/Whq050207
      - NEO4J_server_memory_pagecache_size=256M
      - NEO4J_server_memory_heap_initial__size=256M
      - NEO4J_server_memory_heap_max__size=512M
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "echo 'RETURN 1;' | cypher-shell -u neo4j -p Whq050207 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
